<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            max-width: 760px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
        }

        table{
            width: 100%;
            border-collapse: collapse;
        }

        th, td{
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th{
            background: #eeeeee;
        }

        form{
            display: grid;
            gap: 10px;
            max-width: 360px;
            margin-top: 16px;
        }

        label{
            display: grid;
            gap: 4px;
        }

        input, button{
            padding: 8px;
        }
    </style>
</head>
<body>
<p><a th:href="@{/}">Back to all address books</a></p>

<h1 th:text="|Address Book #${addressBook.id}|">Address Book</h1>

<p th:if="${#lists.isEmpty(addressBook.buddies)}">This address book is empty.</p>

<table th:unless="${#lists.isEmpty(addressBook.buddies)}">
    <thead>
    <tr>
        <th>Name</th>
        <th>Address</th>
        <th>Phone</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="buddy : ${addressBook.buddies}">
        <td th:text="${buddy.name}">Name</td>
        <td th:text="${buddy.address}">Address</td>
        <td th:text="${buddy.phone}">Phone</td>
    </tr>
    </tbody>
</table>

<h2>Add a buddy</h2>
<form th:action="@{/address-books/{id}/buddies(id=${addressBook.id})}"
      th:object="${newBuddy}" method="post">
    <label for="name">Name
        <input id="name" type="text" th:field="*{name}" required>
    </label>
    <label for="address">Address
        <input id="address" type="text" th:field="*{address}" required>
    </label>
    <label for="phone">Phone
        <input id="phone" type="number" th:field="*{phone}" required>
    </label>
    <button type="submit">Add buddy</button>
</form>
</body>
</html>
