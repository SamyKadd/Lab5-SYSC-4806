<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book App</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            max-width: 760px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
        }

        .card{
            border: 1px solid #cccccc;
            border-radius: 8px;
            padding: 18px;
            margin: 14px 0;
        }

        code{
            background: #f1f1f1;
            padding: 2px 5px;
        }

        button{
            padding: 9px 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h1>Address Book App</h1>
<p>This Spring Boot app is running successfully.</p>

<h2>Saved address books</h2>
<p th:if="${#lists.isEmpty(addressBooks)}">No address books have been created yet.</p>

<div class="card" th:each="addressBook : ${addressBooks}">
    <a th:href="@{/address-books/{id}(id=${addressBook.id})}"
       th:text="|Address Book #${addressBook.id}|">Address Book</a>
    <span th:text="| - ${#lists.size(addressBook.buddies)} buddies|"> - 0 buddies</span>
</div>

<form th:action="@{/address-books}" method="post">
    <button type="submit">Create new address book</button>
</form>
</body>
</html>
